<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>청주에 뜬 달</title>

    <style>
      * {
        touch-action: manipulation;
      }

      html,
      body {
        margin: 0;
        padding: 0;

        background-color: gray;

        overflow: hidden;
        overscroll-behavior: none;
      }

      canvas {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
    </style>

    <script src="/components/Layout.js"></script>
  </head>
  <body>
    <app-layout></app-layout>

    <!-- for using lambda client -->
    <script src="/dist/lambda-client-bundled.js"></script>

    <!-- for p5.js -->
    <script src="/libs/p5.min.js"></script>
    <script src="/Tile.js"></script>

    <script>
      function initializeTiles(
        numberOfRow,
        numberOfCol,
        numberOfTiles,
        tileSize
      ) {
        const tiles = [];

        const MIDDLE_ROW_INDEX = Math.floor(
          (numberOfRow - 1) / 2
        );
        const MIDDLE_COL_INDEX = Math.floor(
          (numberOfCol - 1) / 2
        );

        for (let i = 0; i < numberOfTiles; i++) {
          const rowIndex = Math.floor(
            i / numberOfCol
          );
          const colIndex = i % numberOfCol;

          const unit = tileSize;

          const x = unit * colIndex;
          const y = unit * rowIndex;

          const tile = new Tile(x, y, tileSize);

          tiles.push(tile);
        }

        return tiles;
      }

      function setTiles(width, height) {
        const NUMBER_OF_COL = 23;
        const numberOfCol = NUMBER_OF_COL;
        const tileSize = width / numberOfCol;
        const numberOfRow = Math.ceil(
          height / tileSize
        );
        const numberOfTiles =
          numberOfCol * numberOfRow;

        window.TILE_SIZE = tileSize;
        window.NUMBER_OF_COL = numberOfCol;
        window.NUMBER_OF_ROW = numberOfRow;
        window.NUMBER_OF_TILES = numberOfTiles;

        return {
          tileSize,
          numberOfRow,
          numberOfCol,
          numberOfTiles,
        };
      }
    </script>

    <script>
      let tiles = [];

      function setup() {
        const canvas = createCanvas(
          window.innerWidth,
          window.innerHeight,
          WEBGL
        );

        const {
          tileSize,
          numberOfRow,
          numberOfCol,
          numberOfTiles,
        } = setTiles(canvas.width, canvas.height);

        window.addEventListener("resize", () => {
          resizeCanvas(
            window.innerWidth,
            window.innerHeight
          );

          const {
            tileSize,
            numberOfRow,
            numberOfCol,
            numberOfTiles,
          } = setTiles(width, height);

          tiles = [
            ...initializeTiles(
              numberOfRow,
              numberOfCol,
              numberOfTiles,
              tileSize
            ),
          ];
        });

        background(999);
        angleMode(DEGREES);

        tiles = [
          ...initializeTiles(
            numberOfRow,
            numberOfCol,
            numberOfTiles,
            tileSize
          ),
        ];

        canvas.mousePressed(() => {
          window.isMousePressed = true;
        });

        canvas.mouseReleased(() => {
          window.isMousePressed = false;
        });
      }

      function draw() {
        background(255, 210, 150);

        point(
          mouseX - width / 2,
          mouseY - height / 2,
          0
        );

        // orbitControl();

        tiles.forEach((tile) => {
          tile.checkIsHovered();
          tile.draw();
        });
      }
    </script>
  </body>
</html>
