<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>청주에 뜬 달</title>

    <style>
      * {
        touch-action: manipulation;
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      html,
      body {
        margin: 0;
        padding: 0;

        overflow: hidden;
        overscroll-behavior: none;
      }

      canvas {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(
          -50%,
          -50%
        );
      }
    </style>

    <link
      rel="stylesheet"
      href="/public/styles/font.css"
    />

    <script src="/src/Tile.js"></script>

    <script src="/src/components/PageComponent.js"></script>
    <script src="/src/components/Layout.js"></script>

    <script src="/src/pages/Intro.js"></script>
    <script src="/src/pages/First.js"></script>
    <script src="/src/pages/Second.js"></script>

    <script>
      function rerenderComponents() {
        const appLayout =
          document.querySelector(
            "app-layout"
          );
        appLayout.render();
      }
    </script>
  </head>

  <body>
    <app-layout></app-layout>

    <!-- for using lambda client -->
    <script src="/dist/lambda-client-bundled.js"></script>

    <!-- for p5.js -->
    <script src="/src/libs/p5.min.js"></script>

    <script>
      function setup() {
        const canvas = createCanvas(
          window.innerWidth,
          window.innerHeight,
          WEBGL
        );

        const {
          tileSize,
          numberOfRow,
          numberOfCol,
          numberOfTiles,
        } = Tile.setTiles(
          canvas.width,
          canvas.height
        );

        // After set tiles, rerender components
        rerenderComponents();

        window.addEventListener(
          "resize",
          () => {
            resizeCanvas(
              window.innerWidth,
              window.innerHeight
            );

            const {
              tileSize,
              numberOfRow,
              numberOfCol,
              numberOfTiles,
            } = Tile.setTiles(
              width,
              height
            );

            // After set tiles, rerender components
            rerenderComponents();

            window.tiles = [
              ...Tile.initializeTiles(
                numberOfCol,
                numberOfTiles,
                tileSize
              ),
            ];
          }
        );

        angleMode(DEGREES);
        blendMode(BLEND);

        window.tiles = [
          ...Tile.initializeTiles(
            numberOfCol,
            numberOfTiles,
            tileSize
          ),
        ];

        canvas.mousePressed(() => {
          window.isMousePressed = true;
        });

        canvas.mouseReleased(() => {
          window.isMousePressed = false;
        });
      }

      function draw() {
        clear();

        ortho(
          -width / 2,
          width / 2,
          -height / 2,
          height / 2,
          100,
          1000
        );

        point(
          mouseX - width / 2,
          mouseY - height / 2,
          0
        );

        // orbitControl();

        window.tiles.forEach((tile) => {
          tile.checkIsHovered();

          if (tile.animatingPunching) {
            perspective();
          } else {
            ortho();
          }

          tile.draw();
        });
      }
    </script>
  </body>
</html>
