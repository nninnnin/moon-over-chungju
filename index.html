<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>청주에 뜬 달</title>

    <style>
      * {
        touch-action: manipulation;
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      html,
      body {
        margin: 0;
        padding: 0;

        overflow: hidden;
        overscroll-behavior: none;
      }

      canvas {
        width: 100vw;
        height: 100dvh;

        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(
          -50%,
          -50%
        );
      }
    </style>

    <link
      rel="stylesheet"
      href="/public/styles/font.css"
    />
    <link
      rel="stylesheet"
      href="/public/styles/glide.css"
    />

    <style>
      .moon-header,
      .moon-footer {
        text-align: center;
        font-family: "JTimeMachine";
        letter-spacing: -0.2em;
        font-size: 20px;
        font-weight: 700;
        line-height: 120%;
      }

      .moon {
        width: 140px;
        height: 140px;

        margin-top: 13px;
        margin-bottom: 8px;
      }

      .eng {
        letter-spacing: -0.13em;
      }
    </style>

    <style>
      #moon {
        width: 60px;
        height: 60px;
      }

      #third-input-container {
        width: 100vw;
        height: fit-content;

        position: fixed;
        left: 0;
        top: 50%;
        transform: translateY(-46%);
        z-index: 8000;

        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      #message-input {
        width: 300px;
        height: 28px;

        margin: 34px 0px;

        font-family: JTimeMachine;
        font-weight: 700;
        font-size: 18px;
        text-align: center;
        letter-spacing: -0.2em;

        border: none;
        outline: none;
        background-color: transparent;
      }

      #message-input::placeholder {
        text-align: center;
        color: rgba(0, 0, 0, 0.4);
      }

      /* or, for legacy browsers */

      #message-input::-webkit-input-placeholder {
        text-align: center;
        color: rgba(0, 0, 0, 0.4);
      }

      :-moz-placeholder {
        /* Firefox 18- */
        text-align: center;
        color: rgba(0, 0, 0, 0.4);
      }

      #message-input::-moz-placeholder {
        /* Firefox 19+ */
        text-align: center;
        color: rgba(0, 0, 0, 0.4);
      }

      #message-input:-ms-input-placeholder {
        text-align: center;
        color: rgba(0, 0, 0, 0.4);
      }

      #dummy-box {
        width: 60px;
        height: 60px;
      }

      @keyframes moon-centering {
        0% {
          transform: translateY(0%)
            scale(1);
        }
        100% {
          transform: translateY(40%)
            scale(3);
        }
      }

      @keyframes moon-fly {
        0% {
          transform: translateY(40%)
            scale(3);
        }
        100% {
          transform: translateY(-2000%)
            scale(3);
        }
      }

      .moon-centering {
        animation: moon-centering 1s
          forwards;
      }

      .moon-fly {
        animation: moon-fly 3s forwards;
      }
    </style>

    <!-- for using glide.js -->
    <script src="https://unpkg.com/@glidejs/glide@3.6.0/dist/glide.js"></script>

    <!-- internal classes -->
    <script src="/src/Tile.js"></script>

    <script src="/src/components/PageComponent.js"></script>
    <script src="/src/components/Layout.js"></script>

    <script src="/src/pages/Intro.js"></script>
    <script src="/src/pages/First.js"></script>
    <script src="/src/pages/Second.js"></script>
    <script src="/src/pages/Third.js"></script>
    <script src="/src/pages/Result.js"></script>
    <script src="/src/pages/Error.js"></script>

    <script>
      function rerenderComponents() {
        const appLayout =
          document.querySelector(
            "app-layout"
          );

        console.log(
          "이제 문제는 너다",
          appLayout.state
        );

        appLayout.render();
      }
    </script>
  </head>

  <body>
    <app-layout></app-layout>

    <!-- 3페이지 인풋 -->
    <div id="third-input-container">
      <img id="moon" />

      <input
        id="message-input"
        type="text"
        placeholder="10자 이내로 입력해주세요!"
      />

      <div id="dummy-box"></div>
    </div>

    <!-- 2페이지 글라이드 -->
    <div class="glide">
      <div
        class="glide__track"
        data-glide-el="track"
      >
        <ul class="glide__slides">
          <li class="glide__slide">
            <header class="moon-header">
              신월
              <br />
              <span class="eng"
                >New Moon</span
              >
            </header>

            <img
              class="moon"
              src="/public/images/moon/new-moon.svg"
            />

            <footer class="moon-footer">
              시작
            </footer>
          </li>

          <li class="glide__slide">
            <header class="moon-header">
              초승달
              <br />
              <span class="eng">
                Waxing Crescent
              </span>
            </header>

            <img
              class="moon"
              src="/public/images/moon/waxing-crescent.svg"
            />

            <footer class="moon-footer">
              성장
            </footer>
          </li>

          <li class="glide__slide">
            <header class="moon-header">
              상현달
              <br />
              <span class="eng"
                >New Moon</span
              >
            </header>

            <img
              class="moon"
              src="/public/images/moon/first-quarter.svg"
            />

            <footer class="moon-footer">
              결단
            </footer>
          </li>

          <li class="glide__slide">
            <header class="moon-header">
              차오르는 달
              <br />
              <span class="eng"
                >Waxing Gibbous</span
              >
            </header>

            <img
              class="moon"
              src="/public/images/moon/waxing-gibbous.svg"
            />

            <footer class="moon-footer">
              준비
            </footer>
          </li>

          <li class="glide__slide">
            <header class="moon-header">
              보름달
              <br />
              <span class="eng"
                >Full Moon</span
              >
            </header>

            <img
              class="moon"
              src="/public/images/moon/full-moon.svg"
            />

            <footer class="moon-footer">
              완성
            </footer>
          </li>

          <li class="glide__slide">
            <header class="moon-header">
              기우는 달
              <br />
              <span class="eng"
                >Waning Gibbous</span
              >
            </header>

            <img
              class="moon"
              src="/public/images/moon/waning-gibbous.svg"
            />

            <footer class="moon-footer">
              성찰
            </footer>
          </li>

          <li class="glide__slide">
            <header class="moon-header">
              하현달
              <br />
              <span class="eng"
                >Last Quarter</span
              >
            </header>

            <img
              class="moon"
              src="/public/images/moon/last-quarter.svg"
            />

            <footer class="moon-footer">
              평가
            </footer>
          </li>

          <li class="glide__slide">
            <header class="moon-header">
              그믐달
              <br />
              <span class="eng"
                >Waning Crescent</span
              >
            </header>

            <img
              class="moon"
              src="/public/images/moon/waning-crescent.svg"
            />

            <footer class="moon-footer">
              해방
            </footer>
          </li>
        </ul>
      </div>
    </div>

    <div class="glide__arrows">
      <button
        class="glide__arrow glide__arrow--left"
        data-glide-dir="<"
      >
        <img
          src="/public/images/glide-button--left.svg"
        />
      </button>

      <button
        class="glide__arrow glide__arrow--right"
        data-glide-dir=">"
      >
        <img
          src="/public/images/glide-button--right.svg"
        />
      </button>
    </div>

    <!-- for using lambda client -->
    <script src="/dist/bundled.js"></script>

    <!-- for p5.js -->
    <script src="/src/libs/p5.min.js"></script>

    <script>
      function setup() {
        const canvas = createCanvas(
          window.innerWidth,
          window.innerHeight,
          WEBGL
        );

        window.addEventListener(
          "resize",
          () => {
            resizeCanvas(
              window.innerWidth,
              window.innerHeight
            );

            const {
              tileSize,
              numberOfRow,
              numberOfCol,
              numberOfTiles,
            } = Tile.setTiles(
              width,
              height
            );

            // After set tiles, rerender components
            rerenderComponents();

            window.tiles = [
              ...Tile.initializeTiles(
                numberOfCol,
                numberOfTiles,
                tileSize
              ),
            ];
          }
        );

        angleMode(DEGREES);
        blendMode(BLEND);

        canvas.mousePressed(() => {
          window.isMousePressed = true;
        });

        canvas.mouseReleased(() => {
          window.isMousePressed = false;
        });

        rerenderComponents();
      }

      let animatingFill = false;

      function draw() {
        clear();

        ortho(
          -width / 2,
          width / 2,
          -height / 2,
          height / 2,
          100,
          1000
        );

        // orbitControl();

        if (!window.tiles) return;

        const isAnimatingFillOver =
          window.tiles.every(
            (tile) =>
              !tile.animatingFill
          );

        if (
          animatingFill &&
          isAnimatingFillOver
        ) {
          animatingFill = false;

          rerenderComponents();
        }

        if (
          !animatingFill &&
          !isAnimatingFillOver
        ) {
          animatingFill = true;
        }

        window.tiles.forEach((tile) => {
          tile.checkIsHovered();

          // if (tile.animatingPunching) {
          //   perspective();
          // } else {
          //   ortho(
          //     -width / 2,
          //     width / 2,
          //     -height / 2,
          //     height / 2,
          //     100,
          //     1000
          //   );
          // }

          perspective();

          tile.draw();
        });
      }
    </script>
  </body>
</html>
