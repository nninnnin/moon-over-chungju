<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>청주에 뜬 달</title>

    <style>
      * {
        touch-action: manipulation;
        box-sizing: border-box;
        -webkit-font-smoothing: auto;
        text-rendering: optimizeLegibility;
      }

      html,
      body {
        margin: 0;
        padding: 0;

        overflow: hidden;
        overscroll-behavior: none;
      }

      canvas {
        width: 100vw;
        height: 100dvh;

        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(
          -50%,
          -50%
        );

        background-color: transparent;
      }
    </style>

    <link
      rel="stylesheet"
      href="/public/styles/font.css"
    />
    <link
      rel="stylesheet"
      href="/public/styles/glide.css"
    />

    <style>
      .moon-header,
      .moon-footer {
        text-align: center;
        font-family: "JTimeMachine";
        letter-spacing: -0.2em;
        font-size: 20px;
        font-weight: 700;
        line-height: 120%;
      }

      .moon {
        width: 140px;
        height: 140px;

        margin-top: 13px;
        margin-bottom: 8px;
      }

      .eng {
        letter-spacing: -0.13em;
      }
    </style>

    <style>
      #third-input-container {
        width: 100vw;
        height: 100px;

        position: fixed;
        left: 0;
        top: 0%;
        z-index: 8000;

        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      #message-input {
        width: 300px;

        margin-top: 3vh;
        margin-bottom: 1vh;

        font-family: JTimeMachine;
        font-weight: 700;
        font-size: 18px;
        text-align: center;
        letter-spacing: -0.2em;

        border: none;
        outline: none;
        background-color: transparent;
      }

      #message-input::placeholder {
        text-align: center;
        color: rgba(0, 0, 0, 0.4);
      }

      /* or, for legacy browsers */

      #message-input::-webkit-input-placeholder {
        text-align: center;
        color: rgba(0, 0, 0, 0.4);
      }

      :-moz-placeholder {
        /* Firefox 18- */
        text-align: center;
        color: rgba(0, 0, 0, 0.4);
      }

      #message-input::-moz-placeholder {
        /* Firefox 19+ */
        text-align: center;
        color: rgba(0, 0, 0, 0.4);
      }

      #message-input:-ms-input-placeholder {
        text-align: center;
        color: rgba(0, 0, 0, 0.4);
      }

      @keyframes fadeOut {
        0% {
          opacity: 1;
        }

        100% {
          opacity: 0;
        }
      }

      .fadeout {
        animation: fadeOut 1s forwards;
      }

      @keyframes moonDrive {
        0% {
          bottom: -30%;
          opacity: 0.2;
        }

        50% {
          bottom: 50%;
          opacity: 1;
        }

        100% {
          bottom: 150%;
          opacity: 1;
        }
      }

      #last-moon {
        width: 90vw;
        height: 90vw;

        position: fixed;
        bottom: -100%;
        left: 50%;
        transform: translate(-50%, 50%);
        z-index: 100;
      }

      .moon-drive {
        animation: moonDrive 4s forwards;
        animation-timing-function: ease-in-out;
      }
    </style>

    <!-- for using glide.js -->
    <script src="https://unpkg.com/@glidejs/glide@3.6.0/dist/glide.js"></script>

    <!-- internal classes -->
    <!--
      **
        주의: 클래스 간 디펜던시가 존재하므로,
        import 순서를 변경하면 작동하지 않을 수 있습니다.
      **
    -->
    <script src="/src/constants/index.js"></script>

    <script src="/src/Tile.js"></script>

    <script src="/src/components/PageComponent.js"></script>
    <script src="/src/components/AboutDialog.js"></script>
    <script src="/src/components/Layout.js"></script>
    <script src="/src/components/Marquee.js"></script>

    <script src="/src/pages/Intro.js"></script>
    <script src="/src/pages/First.js"></script>
    <script src="/src/pages/Second.js"></script>
    <script src="/src/pages/Result.js"></script>
    <script src="/src/pages/Error.js"></script>

    <script>
      function rerenderComponents() {
        const appLayout =
          document.querySelector(
            "app-layout"
          );

        appLayout.render();
      }
    </script>
  </head>

  <body>
    <app-layout></app-layout>

    <div id="third-input-container">
      <input
        id="message-input"
        type="text"
        placeholder="10자 이내로 입력해주세요!"
      />
    </div>

    <img
      id="last-moon"
      src="/public/images/last-moon.png"
    />

    <!-- for using lambda client -->
    <script src="/dist/bundled.js"></script>

    <!-- for p5.js -->
    <script src="/src/libs/p5.min.js"></script>

    <script>
      function setup() {
        const canvas = createCanvas(
          window.innerWidth,
          window.innerHeight,
          WEBGL
        );

        window.addEventListener(
          "resize",
          () => {
            resizeCanvas(
              window.innerWidth,
              window.innerHeight
            );

            const {
              tileSize,
              numberOfRow,
              numberOfCol,
              numberOfTiles,
            } = Tile.setTiles(
              width,
              height
            );

            // After set tiles, rerender components
            rerenderComponents();

            window.tiles = [
              ...Tile.initializeTiles(
                numberOfCol,
                numberOfTiles,
                tileSize
              ),
            ];
          }
        );

        angleMode(DEGREES);
        blendMode(BLEND);

        rerenderComponents();
      }

      function draw() {
        clear();

        ortho(
          -width / 2,
          width / 2,
          -height / 2,
          height / 2,
          100,
          1000
        );

        // orbitControl();

        if (!window.tiles) return;

        window.tiles.forEach((tile) => {
          tile.checkIsHovered();

          // if (tile.animatingPunching) {
          //   perspective();
          // } else {
          //   ortho(
          //     -width / 2,
          //     width / 2,
          //     -height / 2,
          //     height / 2,
          //     100,
          //     1000
          //   );
          // }

          perspective();

          tile.draw();
        });
      }
    </script>
  </body>
</html>
